<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA AI</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #08090d;
  color: white;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
}

.sidebar {
  width: 250px;
  background: #101116;
  padding: 25px;
  border-right: 1px solid #252630;
}

.logo {
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 5px;
  color: #a78bfa;
  margin-bottom: 40px;
}

.new-chat {
  background: #22232e;
  padding: 14px;
  border-radius: 10px;
  cursor: pointer;
  text-align: center;
  margin-bottom: 25px;
}

.new-chat:hover {
  background: #37304f;
}

.menu {
  color: #999;
  line-height: 3;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}

.topbar {
  width: 100%;
  padding: 20px 30px;
  border-bottom: 1px solid #252630;
  display: flex;
  justify-content: space-between;
}

select {
  background: #171821;
  color: white;
  border: 1px solid #333;
  padding: 10px;
  border-radius: 8px;
}

.welcome {
  margin-top: 13vh;
  text-align: center;
}

.welcome h1 {
  font-size: 48px;
  background: linear-gradient(90deg,#a78bfa,#60a5fa);
  -webkit-background-clip: text;
  color: transparent;
}

.welcome p {
  color: #999;
  margin-top: 15px;
}

.chat {
  width: 80%;
  max-width: 850px;
  flex: 1;
  overflow-y: auto;
  padding: 30px 0;
}

.message {
  padding: 16px;
  margin: 12px 0;
  border-radius: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
}

.user {
  background: #242433;
  margin-left: 15%;
}

.ai {
  background: #151720;
  border: 1px solid #292b38;
  margin-right: 10%;
}

.input-area {
  width: 80%;
  max-width: 850px;
  margin-bottom: 25px;
  background: #171821;
  border: 1px solid #38394a;
  border-radius: 15px;
  display: flex;
  padding: 12px;
}

.input-area input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-size: 16px;
  padding: 10px;
}

.input-area button {
  background: #8b5cf6;
  color: white;
  border: none;
  padding: 12px 22px;
  border-radius: 10px;
  cursor: pointer;
}

.input-area button:hover {
  background: #7040db;
}

@media(max-width:700px) {
  .sidebar { display:none; }
  .chat,.input-area { width:92%; }
  .welcome h1 { font-size:35px; }
}
</style>
</head>

<body>

<aside class="sidebar">
  <div class="logo">AURA</div>

  <div class="new-chat" onclick="newChat()">
    + New Chat
  </div>

  <div class="menu">
    <p>◈ Explore</p>
    <p>◈ AI Assistant</p>
    <p>◈ Coding</p>
    <p>◈ Research</p>
    <p>◈ Settings</p>
  </div>
</aside>

<main class="main">

  <div class="topbar">
    <span>Personal AI Assistant</span>

    <select id="model">
      <option>AURA AI</option>
      <option>Creative Mode</option>
      <option>Coding Mode</option>
      <option>Research Mode</option>
    </select>
  </div>

  <div class="welcome" id="welcome">
    <h1>Welcome to AURA</h1>
    <p>Your intelligent AI assistant. What can I help you with?</p>
  </div>

  <div class="chat" id="chat"></div>

  <div class="input-area">
    <input
      id="prompt"
      type="text"
      placeholder="Ask AURA anything..."
      onkeydown="if(event.key==='Enter') sendMessage()"
    >

    <button onclick="sendMessage()">Send ➤</button>
  </div>

</main>

<script>
function sendMessage() {
  const input = document.getElementById("prompt");
  const chat = document.getElementById("chat");
  const welcome = document.getElementById("welcome");

  const message = input.value.trim();

  if (!message) return;

  welcome.style.display = "none";

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = message;

  chat.appendChild(userMessage);

  input.value = "";

  const aiMessage = document.createElement("div");
  aiMessage.className = "message ai";
  aiMessage.textContent =
    "Hello! I'm AURA AI. To activate intelligent responses, connect an AI API to this interface.";

  chat.appendChild(aiMessage);

  chat.scrollTop = chat.scrollHeight;
}

function newChat() {
  document.getElementById("chat").innerHTML = "";
  document.getElementById("welcome").style.display = "block";
}
</script>

</body>
</html>
